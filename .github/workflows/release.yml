name: Release

# Actions are pinned to Node 24-compatible commit SHAs. Dependabot updates them.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Validate tag and prepare release notes
        id: metadata
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -match '^v(?<version>\d+\.\d+\.\d+)$') {
            $version = $Matches.version
          }
          else {
            throw "Release tag '$tag' must use the vMAJOR.MINOR.PATCH format."
          }
          [xml]$props = Get-Content Directory.Build.props -Raw
          $versionNode = $props.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "Directory.Build.props has no Version property."
          }
          $projectVersion = $versionNode.InnerText.Trim()
          if ($projectVersion -ne $version) {
            throw "Project version '$projectVersion' does not match tag version '$version'."
          }

          $changelog = @(Get-Content CHANGELOG.md)
          $headingPattern = '^## \[{0}\](?:\s|$)' -f [regex]::Escape($version)
          $start = -1
          for ($i = 0; $i -lt $changelog.Count; $i++) {
            if ($changelog[$i] -match $headingPattern) {
              $start = $i
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no section for version $version."
          }

          $end = $changelog.Count
          for ($i = $start + 1; $i -lt $changelog.Count; $i++) {
            if ($changelog[$i] -match '^## ') {
              $end = $i
              break
            }
          }

          $notesLines = @()
          if ($end -gt ($start + 1)) {
            $notesLines = $changelog[($start + 1)..($end - 1)]
          }
          $notes = ($notesLines -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "CHANGELOG.md has no release notes for version $version."
          }

          New-Item -ItemType Directory -Force -Path .dist | Out-Null
          Set-Content -Path (Join-Path .dist 'release-notes.md') -Value $notes -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore KeyGrid.slnx
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed with exit code $LASTEXITCODE."
          }

      - name: Test
        shell: pwsh
        run: |
          dotnet test KeyGrid.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test failed with exit code $LASTEXITCODE."
          }

      - name: Publish and package
        shell: pwsh
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $publishDir = '.dist\publish'
          dotnet publish src/KeyGrid/KeyGrid.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output $publishDir `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          Copy-Item -Path LICENSE -Destination (Join-Path $publishDir 'LICENSE') -Force

          if (-not (Test-Path (Join-Path $publishDir 'LICENSE'))) {
            throw "The publish output does not contain LICENSE."
          }

          $pdbFiles = @(Get-ChildItem -Path $publishDir -Filter *.pdb -File -Recurse -Force)
          if ($pdbFiles.Count -ne 0) {
            throw "The publish output contains PDB files."
          }

          $archivePath = ".dist\KeyGrid-${env:VERSION}-win-x64.zip"
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            .dist/KeyGrid-${{ steps.metadata.outputs.version }}-win-x64.zip
            .dist/release-notes.md
          # The staging directory name starts with a dot, so the action treats
          # its contents as hidden. Only the two exact files above are uploaded.
          include-hidden-files: true
          # Artifacts are immutable by default; allow a failed-job rerun to
          # replace the artifact produced by the previous attempt.
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  release:
    # Signing secrets are scoped to this protected environment and are not
    # available to the build job.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    environment: release
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .dist

      - name: Prepare release assets
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $archivePath = ".dist\KeyGrid-${env:VERSION}-win-x64.zip"
          if (-not (Test-Path $archivePath)) {
            throw "Release archive not found: $archivePath"
          }

          $isSigned = $false
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
              throw "WINDOWS_SIGNING_CERT_PASSWORD must be set when WINDOWS_SIGNING_CERT_BASE64 is configured."
            }

            $pfxPath = Join-Path $env:RUNNER_TEMP 'keygrid-signing.pfx'
            $signingDir = '.dist\signing'
            try {
              if (Test-Path $signingDir) {
                Remove-Item -Path $signingDir -Recurse -Force
              }
              Expand-Archive -Path $archivePath -DestinationPath $signingDir

              if (-not (Test-Path (Join-Path $signingDir 'LICENSE'))) {
                throw "The release archive does not contain LICENSE."
              }
              $pdbFiles = @(Get-ChildItem -Path $signingDir -Filter *.pdb -File -Recurse -Force)
              if ($pdbFiles.Count -ne 0) {
                throw "The release archive contains PDB files."
              }

              [IO.File]::WriteAllBytes(
                $pfxPath,
                [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
              $certificates = @(Get-PfxCertificate `
                -FilePath $pfxPath `
                -Password (ConvertTo-SecureString $env:SIGNING_CERT_PASSWORD -AsPlainText -Force))
              # A PFX can contain a chain. Select the single code-signing identity
              # that can actually produce a signature instead of passing an array.
              $certificate = $certificates |
                Where-Object { $_.HasPrivateKey } |
                Select-Object -First 1
              if ($null -eq $certificate) {
                throw "The signing certificate does not contain a private key."
              }

              $files = @('KeyGrid.exe', 'KeyGrid.dll', 'KeyGrid.Core.dll') | ForEach-Object { Join-Path $signingDir $_ }
              foreach ($file in $files) {
                if (-not (Test-Path $file)) {
                  throw "Signing target not found: $file"
                }

                $signature = Set-AuthenticodeSignature `
                  -FilePath $file `
                  -Certificate $certificate `
                  -TimestampServer 'http://timestamp.digicert.com' `
                  -HashAlgorithm SHA256
                if ($signature.Status -ne 'Valid') {
                  throw "Authenticode signing failed for $(Split-Path $file -Leaf): $($signature.StatusMessage)"
                }
              }

              Remove-Item -Path $archivePath -Force
              Compress-Archive -Path (Join-Path $signingDir '*') -DestinationPath $archivePath -CompressionLevel Optimal
              $isSigned = $true
            }
            finally {
              if (Test-Path $pfxPath) {
                Remove-Item -Path $pfxPath -Force
              }
              if (Test-Path $signingDir) {
                Remove-Item -Path $signingDir -Recurse -Force
              }
            }
          }
          else {
            Write-Warning "Authenticode signing is not configured; publishing unsigned binaries."
          }

          if (-not $isSigned) {
            $notesPath = '.dist\release-notes.md'
            if (-not (Test-Path $notesPath)) {
              throw "Release notes not found: $notesPath"
            }
            Add-Content -Path $notesPath -Encoding utf8 -Value @(
              '',
              '> **Unsigned development build.** This release was produced without Authenticode signing.',
              '> Managed environments must deploy only signed binaries.'
            )
          }

          # Validate the final archive even when signing is skipped, so an unsigned
          # release cannot silently ship without LICENSE or with PDB files.
          $verifyDir = '.dist\verify'
          try {
            if (Test-Path $verifyDir) {
              Remove-Item -Path $verifyDir -Recurse -Force
            }
            Expand-Archive -Path $archivePath -DestinationPath $verifyDir
            if (-not (Test-Path (Join-Path $verifyDir 'LICENSE'))) {
              throw "The release archive does not contain LICENSE."
            }
            $pdbFiles = @(Get-ChildItem -Path $verifyDir -Filter *.pdb -File -Recurse -Force)
            if ($pdbFiles.Count -ne 0) {
              throw "The release archive contains PDB files."
            }
          }
          finally {
            if (Test-Path $verifyDir) {
              Remove-Item -Path $verifyDir -Recurse -Force
            }
          }

          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archivePath -Leaf)" |
            Set-Content -Path '.dist\SHA256SUMS.txt' -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archivePath = ".dist\KeyGrid-${env:VERSION}-win-x64.zip"
          $checksumPath = '.dist\SHA256SUMS.txt'
          $notesPath = '.dist\release-notes.md'
          foreach ($path in @($archivePath, $checksumPath, $notesPath)) {
            if (-not (Test-Path $path)) {
              throw "Release asset not found: $path"
            }
          }

          # A rerun of a failed release job must replace assets left by the
          # previous attempt instead of failing because the release exists.
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archivePath $checksumPath `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release asset upload failed with exit code $LASTEXITCODE."
            }

            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "KeyGrid $env:VERSION" `
              --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release update failed with exit code $LASTEXITCODE."
            }
          }
          else {
            gh release create $tag $archivePath $checksumPath `
              --repo $env:GITHUB_REPOSITORY `
              --title "KeyGrid $env:VERSION" `
              --notes-file $notesPath `
              --verify-tag
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed with exit code $LASTEXITCODE."
            }
          }

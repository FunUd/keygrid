<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 3x3 cell grid; the center cell is the accent. The tile background is
       transparent so only the grid and accent cell are drawn. -->
  <g fill="none" stroke="#454b5c" stroke-width="4">
    <rect x="52" y="52" width="44" height="44" rx="10"/>
    <rect x="106" y="52" width="44" height="44" rx="10"/>
    <rect x="160" y="52" width="44" height="44" rx="10"/>
    <rect x="52" y="106" width="44" height="44" rx="10"/>
    <rect x="160" y="106" width="44" height="44" rx="10"/>
    <rect x="52" y="160" width="44" height="44" rx="10"/>
    <rect x="106" y="160" width="44" height="44" rx="10"/>
    <rect x="160" y="160" width="44" height="44" rx="10"/>
  </g>
  <rect x="106" y="106" width="44" height="44" rx="10" fill="#ff2828" fill-opacity="0.4"/>
</svg>
